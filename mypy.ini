# mypy settings for CI (the "lint" job and scripts/ci-local.sh). The mypy
# version is pinned in .github/ci-requirements.txt. Run from the repository
# root: mypy
#
# Strict checking, scoped to the modules in `files` (pure logic, no I/O of
# their own). Grow the list one module at a time: add it here, fix its errors.
# Every other module they import (ours in ext/ or upstream's) is followed
# silently, so its errors are not reported; upstream garmin_mcp, garminconnect
# and mcp are not installed where the check runs and are treated as Any.
[mypy]
python_version = 3.10
mypy_path = ext
files =
    ext/status_common.py,
    ext/daily_status.py,
    ext/weekly_status.py
strict = True
follow_imports = silent
# text_hygiene (not in `files` yet) has no annotations: calling it is allowed.
untyped_calls_exclude = text_hygiene
# The tools are registered with FastMCP's @app.tool() (app is upstream's, so Any)
# and mcp2_compat.server_loop (not in `files` yet).
disallow_untyped_decorators = False
warn_unreachable = True
pretty = False
# No .mypy_cache in the repository (CI and ci-local.sh write nothing here).
cache_dir = /dev/null

[mypy-garmin_mcp.*,garminconnect.*,mcp.*,garth.*]
ignore_missing_imports = True
follow_imports = skip
