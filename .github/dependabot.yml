# Weekly update pull requests for the pinned pieces: GitHub Actions (full commit
# SHAs), the Python pins and the Docker base images.
#
# What Dependabot cannot do here:
# - bump ARG GARMIN_MCP_REF in the Dockerfile (an upstream commit, not a
#   release): check upstream by hand and bump it with constraints.txt;
# - keep paired pins in step. CI's pin-drift check fails a pull request that
#   moves one side only: the caddy image tag and scripts/ci-tools.sh, the python
#   image tag and FULL_PYTHON in ci.yml, constraints.txt and the generated files
#   in config/. Finish such a pull request by hand (regenerate the config/ file
#   as its header says) or close it;
# - see the dependency tree of the hashed files: they install with --no-deps,
#   so a green pull request can still break a declared requirement (uuid-utils
#   1.x passed CI although langsmith needs <1.0). Re-resolve before merging.
#
# cooldown: proposes only releases at least 14 days old, the same rule the
# generated files follow. The python base image stays on 3.12 (FULL_PYTHON in
# ci.yml, the cp312 wheels in config/): only patch releases are proposed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    # constraints.txt and the hashed core lock at the top, the hashed feature
    # files in config/, the CI tools and the eval harness (pip-compile files).
    directories: ["/", "/config", "/.github", "/evals"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    # Upstream's pyproject pins these exactly and the Dockerfile re-checks that
    # list: they move only with GARMIN_MCP_REF.
    ignore:
      - dependency-name: garminconnect
      - dependency-name: requests
      - dependency-name: python-dotenv
    groups:
      python-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
