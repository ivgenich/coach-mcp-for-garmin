# CI: unit tests (two legs; the full one with a coverage floor), the sign-in end
# to end, the eval tests offline, lint and the type check, secrets, known
# vulnerabilities and a container smoke test. Nothing here needs a secret or a
# Garmin login. Every action is pinned to a full commit SHA; the tools are
# pinned in scripts/ci-tools.sh and .github/ci-requirements.txt.
# The same steps without Docker or GitHub: scripts/ci-local.sh
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays: new advisories and base-image changes show up without a push.
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  FULL_PYTHON: "3.12.15" # the image's Python (Dockerfile: FROM python:3.12.15-slim)
  STDLIB_PYTHON: "3.10"
  TOOLS_PYTHON: "3.12"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  tests-stdlib:
    name: tests (stdlib)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.STDLIB_PYTHON }}
      - name: Unit tests with the standard library only
        run: python -B scripts/ci-unittest.py

  tests-full:
    name: tests (full)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.FULL_PYTHON }}
          cache: pip
          cache-dependency-path: |
            constraints.txt
            Dockerfile
            config/requirements-build.txt
            config/requirements-core.txt
            config/garmin-key-client.txt
            config/requirements-telemetry.txt
            config/requirements-test.txt
      - name: Caddy at the image's version, and gitleaks for the release-check tests
        run: |
          scripts/ci-tools.sh "$RUNNER_TEMP/bin" caddy gitleaks
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: Install upstream and the image's pins, as the Dockerfile does
        run: python -B scripts/ci-checks.py install-full
      - name: The environment is exactly constraints.txt
        run: python -B scripts/ci-checks.py verify-env
      - name: The test-only packages (coverage, hypothesis; hashed), after verify-env, never in the image
        run: python -m pip install --require-hashes --no-deps -r config/requirements-test.txt
      - name: Unit tests under coverage, no skip allowed for upstream, mcp 2.x or caddy
        env:
          REQUIRE_UPSTREAM: "1"
          REQUIRE_TELEMETRY: "1"
          COVERAGE_FILE: ${{ runner.temp }}/coverage/.coverage
        run: |
          mkdir -p "$RUNNER_TEMP/coverage"
          python -B -m coverage run --rcfile=.coveragerc scripts/ci-unittest.py
      - name: Coverage of ext/ (test files left out), the uncovered lines; fails under the floor in .coveragerc
        env:
          COVERAGE_FILE: ${{ runner.temp }}/coverage/.coverage
        run: |
          python -B -m coverage combine --rcfile=.coveragerc --quiet
          python -B -m coverage report --rcfile=.coveragerc
      - name: Sign-in end to end on 127.0.0.1 (fake secrets, no Garmin login)
        run: python -B scripts/e2e-local.py --work "$RUNNER_TEMP/e2e" --caddy "$RUNNER_TEMP/bin/caddy"

  tests-postgres:
    # History search's Postgres code (job queue, shared Garmin guard, history store, retrieval) against a real
    # Postgres with pgvector. These tests skip everywhere else (no COACH_TEST_DATABASE_URL): here a skip fails.
    name: tests (postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: coach
          POSTGRES_PASSWORD: ci-only-not-secret
          POSTGRES_DB: coach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coach -d coach_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COACH_TEST_DATABASE_URL: postgresql://coach:ci-only-not-secret@127.0.0.1:5432/coach_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.FULL_PYTHON }}
          cache: pip
          cache-dependency-path: |
            constraints.txt
            Dockerfile
            config/requirements-build.txt
            config/requirements-core.txt
            config/requirements-telemetry.txt
            config/requirements-history.txt
            config/requirements-test.txt
      - name: The image's pins plus the history pins (HISTORY=1) and the test-only pins, in a venv of its own
        run: |
          python -m venv "$RUNNER_TEMP/venv-history"
          "$RUNNER_TEMP/venv-history/bin/python" -B scripts/ci-checks.py install-full
          "$RUNNER_TEMP/venv-history/bin/python" -m pip install --require-hashes --no-deps \
            -r config/requirements-history.txt
          "$RUNNER_TEMP/venv-history/bin/python" -m pip install --require-hashes --no-deps \
            -r config/requirements-test.txt
          "$RUNNER_TEMP/venv-history/bin/python" -c "import psycopg, hypothesis"
      - name: Licences of the feature and test-only packages, against their installed metadata
        run: |
          "$RUNNER_TEMP/venv-history/bin/python" -B scripts/ci-checks.py licenses
      - name: Caddy at the image's version, and gitleaks (the full leg's other tests need them)
        run: |
          scripts/ci-tools.sh "$RUNNER_TEMP/bin" caddy gitleaks
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: Unit tests with the database (job queue, guard, history store, retrieval); no history or Postgres skip
        env:
          REQUIRE_UPSTREAM: "1"
          REQUIRE_TELEMETRY: "1"
          REQUIRE_HISTORY: "1"
          REQUIRE_DATABASE: "1"
        run: |
          "$RUNNER_TEMP/venv-history/bin/python" -B scripts/ci-unittest.py
      - name: History eval tests, and the retrieval gate without a model (memory, then Postgres)
        run: |
          py="$RUNNER_TEMP/venv-history/bin/python"
          "$py" -B -m unittest discover -s evals/tests -t . -p 'test_history_*.py'
          "$py" -B -m evals.history --embeddings none --gate
          "$py" -B -m evals.history --backend postgres --embeddings none --gate

  evals-offline:
    name: evals (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.FULL_PYTHON }}
          cache: pip
          cache-dependency-path: |
            constraints.txt
            Dockerfile
            config/requirements-build.txt
            config/requirements-core.txt
            evals/requirements.txt
            config/requirements-telemetry.txt
            config/requirements-history.txt
      - name: A venv of its own (tests-full checks its venv equals constraints.txt), with the history pins
        run: |
          python -m venv "$RUNNER_TEMP/venv-evals"
          "$RUNNER_TEMP/venv-evals/bin/python" -B scripts/ci-checks.py install-full
          "$RUNNER_TEMP/venv-evals/bin/python" -m pip install --require-hashes -r evals/requirements.txt
          "$RUNNER_TEMP/venv-evals/bin/python" -m pip install --require-hashes --no-deps \
            -r config/requirements-history.txt
      - name: Eval tests and committed baselines, graded offline (no key, no network)
        run: |
          py="$RUNNER_TEMP/venv-evals/bin/python"
          # The history eval tests skip without the history packages: here a missing package fails.
          "$py" -B -c 'import evals.harness.history as h; assert h.available(), "history packages missing"'
          "$py" -B -m unittest discover -s evals/tests -t .
          for d in evals/baselines/*/; do
            [ -d "$d/transcripts" ] || continue
            "$py" -B -m evals grade "$d" --out "$RUNNER_TEMP/baselines/$(basename "$d")"
          done

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.TOOLS_PYTHON }}
          cache: pip
          cache-dependency-path: .github/ci-requirements.txt
      - name: Install ruff, mypy and pip-audit (hashed pins)
        run: python -m pip install --require-hashes -r .github/ci-requirements.txt
      - name: Install shellcheck, hadolint and actionlint (pinned, sha256 checked)
        run: |
          scripts/ci-tools.sh "$RUNNER_TEMP/bin" shellcheck hadolint actionlint
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: ruff
        run: ruff check --no-cache --output-format github .
      - name: mypy, strict, on the modules mypy.ini lists
        run: mypy
      - name: shellcheck
        run: git ls-files -z --cached --others --exclude-standard -- '*.sh' | xargs -0 shellcheck
      - name: hadolint
        run: hadolint --no-color Dockerfile
      - name: actionlint
        run: actionlint -no-color
      - name: No hidden characters in the repository's text files
        run: python -B scripts/ci-checks.py text-scan
      - name: CI pins match the Dockerfile
        run: python -B scripts/ci-checks.py pin-drift
      - name: ext/version.py, and the tag on a release push
        run: python -B scripts/ci-checks.py version
      - name: compose.yaml resolves and keeps its rules (stub settings, no daemon)
        run: python -B scripts/ci-checks.py compose

  secrets-deps:
    name: secrets and dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.TOOLS_PYTHON }}
          cache: pip
          cache-dependency-path: .github/ci-requirements.txt
      - name: Install pip-audit (hashed pins)
        run: python -m pip install --require-hashes -r .github/ci-requirements.txt
      - name: Install gitleaks (pinned, sha256 checked)
        run: |
          scripts/ci-tools.sh "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: gitleaks over every commit (findings redacted)
        run: gitleaks git --redact --no-banner --no-color --verbose .
      - name: pip-audit on constraints.txt and the feature files (one run each)
        run: python -B scripts/ci-checks.py audit

  smoke:
    name: container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.FULL_PYTHON }}
          cache: pip
          cache-dependency-path: |
            constraints.txt
            Dockerfile
            config/requirements-build.txt
            config/requirements-core.txt
            config/requirements-telemetry.txt
      - name: The mcp client for scripts/test-protocol.py (the image's pins, every package by hash)
        run: python -B scripts/ci-checks.py install-full
      - name: Build the image, run it with fake secrets and no Garmin login, check it
        env:
          SMOKE_PYTHON: python
        run: scripts/ci-smoke.sh
      - name: The history image builds too (HISTORY=1; build only)
        run: docker build --build-arg HISTORY=1 -t coach-mcp:history .
