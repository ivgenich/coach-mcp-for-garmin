# ---- flags, newest first ("when did I last ...")

[[query]]
id = "F01"
tool = "search"
flags = "short_nights"
order = "newest"
relevant = { sleep_debt_2 = 2, sleep_debt_1 = 1 }

[[query]]
id = "F02"
tool = "search"
flags = "hrv_down"
order = "newest"
relevant = { hrv_drop_3 = 2, hrv_drop_2 = 1, hrv_drop_1 = 1 }

[[query]]
id = "F03"
tool = "search"
flags = "load_high"
relevant = { load_spike_1 = 2, load_spike_2 = 2 }

# ---- days

[[query]]
id = "D01"
tool = "search"
kind = "day"
query = "a very short night of sleep"
relevant = { short_sleep_days = 2, sleep_debt_days = 1 }

[[query]]
id = "D02"
tool = "search"
kind = "day"
flags = "short_sleep"
order = "newest"
relevant = { short_sleep_days = 2, sleep_debt_days = 1 }
