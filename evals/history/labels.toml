[[query]]
id = "T11"
tool = "search"
query = "when was I this tired"
relevant = { hrv_drop_1 = 2, hrv_drop_2 = 2, hrv_drop_3 = 2, sleep_debt_1 = 2, sleep_debt_2 = 2, high_stress_1 = 1, high_stress_2 = 1 }

[[query]]
id = "T12"
tool = "search"
