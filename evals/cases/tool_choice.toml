# Tool choice and arguments: does the model pick the tool the server means for the question, with the right
# dates? Daily cases run on Wednesday 2026-03-18 06:30 Athens (the daily base), weekly ones on Sunday 2026-03-08.

[defaults]
mode = "full"
now = "2026-03-18T06:30"
tz = "Europe/Athens"
garmin = { base = "daily_2026_03_18" }

[[case]]
id = "T01"
title = "How am I today: get_daily_status first"
prompt = "How am I today?"
smoke = true
why = """The headline question. On the iPhone app and in routines only the tool descriptions route it, so the
first call must be get_daily_status, not a fan-out over sleep, HRV and readiness."""
[case.expect]
first_tool = "get_daily_status"
max_tool_calls = 2
tool_output_has = ["green", "Train as planned"]

[[case]]
id = "T02"
title = "Last week: one get_weekly_status call"
prompt = "How did my last week go?"
now = "2026-03-08T06:30"
garmin = { base = "weekly_2026_03_01" }
why = """A week in review is one get_weekly_status call; it must not turn into 7 to 14 single-day calls."""
[case.expect]
tools_all = ["get_weekly_status"]
max_tool_calls = 1
tool_output_has = ["yellow", "short_nights", "gear_near_limit"]

[[case]]
id = "T03"
title = "Runs of 1-7 March: one date-range call"
prompt = "Which runs did I do from 1 to 7 March?"
variants = ["instr"]
now = "2026-03-08T06:30"
garmin = { base = "weekly_2026_03_01", overlays = ["weekly_activities"] }
why = """The instructions say to prefer one date-range call to many single-day calls; the runs listed must be the
fixture's runs in that range (the easy run of 3 March and the long run of 6 March), not older ones."""
[case.expect]
tools_all = ["get_activities_by_date"]
args = { get_activities_by_date = { start_date = "2026-03-01", end_date = "2026-03-07" } }
max_tool_calls = 2
must_mention = ["Long Run", "Easy Run"]
must_not_mention = ["Old Run"]
no_invented_numbers = true
tool_output_has = ["Synthetic Long Run", "Synthetic Easy Run"]

[[case]]
id = "T04"
title = "Last night's sleep: the wake-up date"
prompt = "How did I sleep last night?"
why = """Garmin files a night under the date you wake up, so last night is 2026-03-18, not 2026-03-17: the
classic off-by-one."""
[case.expect]
tools_any = ["get_sleep_summary", "get_daily_status"]
args = { get_sleep_summary = { date = "2026-03-18" } }
max_tool_calls = 2
no_invented_numbers = true

[[case]]
id = "T05"
title = "Two-week HRV trend: the range tool"
prompt = "Show my HRV trend for the last two weeks"
variants = ["instr"]
garmin = { base = "daily_2026_03_18", overlays = ["hrv_range"] }
why = """A trend is one get_hrv_trend call over a range ending today, not get_daily_status repeated per day."""
[case.expect]
tools_all = ["get_hrv_trend"]
args = { get_hrv_trend = { end_date = "2026-03-18" } }
max_tool_calls = 2
no_invented_numbers = true
tool_output_has = ["period_avg_hrv_ms"]

[[case]]
id = "T06"
title = "Climbs of a saved course: list, then profile"
prompt = "Where are the climbs on my Synthetic Hill Loop course?"
variants = ["instr", "coach"]
garmin = { base = "daily_2026_03_18", overlays = ["courses"] }
why = """Ids come from list tools (get_courses), and get_course_profile is the pacing tool that computes the
climbs; get_course_details has no climbs and the numbers must be the profile's, not recomputed."""
[case.expect]
tools_all = ["get_courses", "get_course_profile"]
tools_none = ["get_course_details"]
args = { get_course_profile = { course_id = 78000002 } }
no_invented_numbers = true
tool_output_has = ["Synthetic Hill Loop", "2.98", "6.4"]

[[case]]
id = "T07"
title = "Status for last Friday: relative date"
prompt = "Give me my status for last Friday"
variants = ["instr"]
garmin = { base = "daily_2026_03_18", overlays = ["daily_2026_03_13"] }
why = """Relative-date arithmetic: seen from Wednesday 2026-03-18, last Friday is 2026-03-13."""
[case.expect]
tools_all = ["get_daily_status"]
args = { get_daily_status = { date = "2026-03-13" } }
max_tool_calls = 2
tool_output_has = ["2026-03-13"]
